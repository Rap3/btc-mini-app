<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BTC Risk Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b26;
      --card-inner: #10141d;
      --text: #ffffff;
      --text-muted: #8b949e;
      --accent-green: #00f092;
      --accent-red: #ff3b69;
      --accent-yellow: #f5a623;
      --accent-blue: #2f80ed;
      --border: #242c3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
    .badge-live { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--accent-green); background: rgba(0, 240, 146, 0.1); padding: 3px 8px; border-radius: 10px; }
    .dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    
    .price-box { text-align: center; padding: 10px 0; }
    .symbol { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px; }
    .price { font-size: 2rem; font-weight: 800; margin: 2px 0; }
    .change { font-size: 0.85rem; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .metric { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .metric-title { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 3px; }
    .metric-value { font-size: 0.95rem; font-weight: 700; }
    
    /* Risk Engine Card */
    .risk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .action-tag { font-size: 1.15rem; font-weight: 800; }
    .score-badge { font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }

    /* Progress bar */
    .bar-bg { width: 100%; height: 6px; background: var(--card-inner); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
    .bar-fill { height: 100%; width: 45%; transition: width 0.4s ease, background-color 0.4s ease; }

    .meta-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; }
    .meta-label { color: var(--text-muted); }
    .meta-val { font-weight: 600; }

    .drivers-box { background: var(--card-inner); border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 0.75rem; }
    .drivers-title { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; margin-bottom: 4px; }
    .driver-item { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .driver-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-yellow); }

    .levels { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 0.72rem; }
    .level-item { display: flex; flex-direction: column; }
    .level-label { color: var(--text-muted); font-size: 0.65rem; }
    .level-val { font-weight: 700; margin-top: 2px; }

    .btn-refresh { width: 100%; background: var(--accent-blue); color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-refresh:active { opacity: 0.8; }

    .up { color: var(--accent-green); }
    .down { color: var(--accent-red); }
    .neutral { color: var(--accent-yellow); }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">BTC Risk Terminal</div>
    <div class="badge-live"><div class="dot"></div> PRO ENGINE</div>
  </div>

  <div class="card price-box">
    <div class="symbol">BTC/USDT PERPETUAL</div>
    <div class="price" id="btcPrice">---.--</div>
    <div class="change" id="btcChange">0.00%</div>
  </div>

  <div class="grid">
    <div class="metric">
      <div class="metric-title">Market Regime</div>
      <div class="metric-value" id="regimeVal" style="font-size: 0.8rem;">---</div>
    </div>
    <div class="metric">
      <div class="metric-title">HTF Trend (1h)</div>
      <div class="metric-value" id="htfVal">---</div>
    </div>
    <div class="metric">
      <div class="metric-title">Choppiness Index</div>
      <div class="metric-value" id="chopVal">--</div>
    </div>
    <div class="metric">
      <div class="metric-title">15m Order Delta</div>
      <div class="metric-value" id="deltaVal">--%</div>
    </div>
  </div>

  <div class="card">
    <div class="risk-header">
      <div class="action-tag" id="actionVal">АНАЛИЗ...</div>
      <div class="score-badge" id="scoreBadge">Score: --</div>
    </div>

    <div class="bar-bg">
      <div class="bar-fill" id="scoreBar"></div>
    </div>

    <div class="meta-row">
      <span class="meta-label">Рекомендация по риску:</span>
      <span class="meta-val" id="riskRec">---</span>
    </div>

    <div class="drivers-box">
      <div class="drivers-title">Драйверы решения (Risk Drivers)</div>
      <div id="driversList">Загрузка факторов...</div>
    </div>

    <div class="levels">
      <div class="level-item">
        <span class="level-label">Take Profit</span>
        <span class="level-val up" id="tpLevel">---</span>
      </div>
      <div class="level-item">
        <span class="level-label">Stop Loss</span>
        <span class="level-val down" id="slLevel">---</span>
      </div>
      <div class="level-item">
        <span class="level-label">Слом структуры</span>
        <span class="level-val" style="color: #ff9f43;" id="invLevel">---</span>
      </div>
    </div>
  </div>

  <button class="btn-refresh" onclick="updateAllData()">Обновить терминал</button>

  <script>
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const BACKEND_URL = "https://btc-az-radar.duckdns.org:8443";
    const SYMBOL = 'BTCUSDT';

    async function fetchTicker() {
      const res = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${SYMBOL}`);
      return await res.json();
    }

    async function fetchRiskEngine() {
      const res = await fetch(`${BACKEND_URL}/api/predict`);
      return await res.json();
    }

    async function updateAllData() {
      try {
        const [ticker, data] = await Promise.all([fetchTicker(), fetchRiskEngine()]);

        if (data.status === "INITIALIZING") return;

        // Биржевые котировки
        const price = parseFloat(ticker.lastPrice);
        const change = parseFloat(ticker.priceChangePercent);
        document.getElementById('btcPrice').innerText = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 1 });
        const changeEl = document.getElementById('btcChange');
        changeEl.innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '% (24h)';
        changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');

        // Микроструктура и фильтры
        document.getElementById('regimeVal').innerText = data.market_regime;
        
        const htfEl = document.getElementById('htfVal');
        htfEl.innerText = data.htf_trend_1h;
        htfEl.className = 'metric-value ' + (data.htf_trend_1h === 'BULLISH' ? 'up' : (data.htf_trend_1h === 'BEARISH' ? 'down' : 'neutral'));

        document.getElementById('chopVal').innerText = data.metrics.choppiness_index;
        
        const deltaEl = document.getElementById('deltaVal');
        deltaEl.innerText = (data.metrics.delta_ratio > 0 ? '+' : '') + data.metrics.delta_ratio + '%';
        deltaEl.className = 'metric-value ' + (data.metrics.delta_ratio > 0 ? 'up' : 'down');

        // Риск-скоринг
        const score = data.trade_score;
        const scoreEl = document.getElementById('scoreBadge');
        const scoreBar = document.getElementById('scoreBar');
        scoreEl.innerText = `Score: ${score}/100`;
        scoreBar.style.width = `${score}%`;

        let themeClass = 'neutral';
        let barColor = 'var(--accent-yellow)';
        if (score >= 70) {
          themeClass = 'up';
          barColor = 'var(--accent-green)';
        } else if (score <= 30) {
          themeClass = 'down';
          barColor = 'var(--accent-red)';
        }

        scoreEl.className = `score-badge ${themeClass}`;
        scoreBar.style.backgroundColor = barColor;

        const actionEl = document.getElementById('actionVal');
        actionEl.innerText = data.action;
        actionEl.className = `action-tag ${themeClass}`;

        document.getElementById('riskRec').innerText = data.risk_recommendation;

        // Драйверы риска
        const driversList = document.getElementById('driversList');
        if (data.risk_drivers && data.risk_drivers.length > 0) {
          driversList.innerHTML = data.risk_drivers.map(d => 
            `<div class="driver-item"><div class="driver-dot"></div><span>${d}</span></div>`
          ).join('');
        } else {
          driversList.innerHTML = '<span style="color: var(--text-muted);">Критических рисков не выявлено</span>';
        }

        // Уровни
        document.getElementById('tpLevel').innerText = data.take_profit > 0 ? '$' + data.take_profit.toLocaleString() : '---';
        document.getElementById('slLevel').innerText = data.stop_loss > 0 ? '$' + data.stop_loss.toLocaleString() : '---';
        document.getElementById('invLevel').innerText = data.structural_invalidation > 0 ? '$' + data.structural_invalidation.toLocaleString() : '---';

      } catch (err) {
        console.warn("Сетевой пропуск тика:", err);
      }
    }

    updateAllData();
    setInterval(updateAllData, 3500);
  </script>
</body>
</html>
