<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BTC Futures Radar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b26;
      --text: #ffffff;
      --text-muted: #8b949e;
      --accent-green: #00f092;
      --accent-red: #ff3b69;
      --accent-yellow: #f5a623;
      --border: #242c3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .badge-live { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--accent-green); background: rgba(0, 240, 146, 0.1); padding: 4px 8px; border-radius: 12px; }
    .dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    
    .price-box { text-align: center; padding: 16px 0; }
    .symbol { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 1px; }
    .price { font-size: 2.2rem; font-weight: 800; margin: 4px 0; }
    .change { font-size: 0.9rem; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .metric { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .metric-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .metric-value { font-size: 1.05rem; font-weight: 700; }
    
    .signal-card { border-left: 4px solid var(--border); }
    .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .signal-direction { font-size: 1.3rem; font-weight: 800; }
    .signal-conf { font-size: 0.85rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    
    .levels { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem; }
    .level-item { display: flex; flex-direction: column; }
    .level-label { color: var(--text-muted); font-size: 0.7rem; }
    .level-val { font-weight: 600; margin-top: 2px; }
    
    .btn-refresh { width: 100%; background: #2f80ed; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .btn-refresh:active { opacity: 0.8; }
    .up { color: var(--accent-green); }
    .down { color: var(--accent-red); }
    .neutral { color: var(--accent-yellow); }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">BTC/USDT ML Radar</div>
    <div class="badge-live"><div class="dot"></div> LIVE</div>
  </div>

  <div class="card price-box">
    <div class="symbol">PERPETUAL CONTRACT</div>
    <div class="price" id="btcPrice">---.--</div>
    <div class="change" id="btcChange">0.00%</div>
  </div>

  <div class="grid">
    <div class="metric">
      <div class="metric-title">Funding Rate (8h)</div>
      <div class="metric-value" id="btcFunding">--%</div>
    </div>
    <div class="metric">
      <div class="metric-title">Open Interest (BTC)</div>
      <div class="metric-value" id="btcOI">--</div>
    </div>
    <div class="metric">
      <div class="metric-title">ML RSI (15m)</div>
      <div class="metric-value" id="btcRSI">--</div>
    </div>
    <div class="metric">
      <div class="metric-title">ATR Волатильность</div>
      <div class="metric-value" id="btcAtr">--</div>
    </div>
  </div>

  <div class="card signal-card" id="signalContainer">
    <div class="signal-header">
      <div class="signal-direction" id="signalAction">ОПРОС ML...</div>
      <div class="signal-conf" id="signalProb">--%</div>
    </div>
    <div style="font-size: 0.82rem; color: var(--text-muted);" id="signalReason">
      Запрос к серверу CatBoost...
    </div>

    <div class="levels">
      <div class="level-item">
        <span class="level-label">Take Profit (ML ATR)</span>
        <span class="level-val up" id="tpLevel">---</span>
      </div>
      <div class="level-item">
        <span class="level-label">Stop Loss (ML ATR)</span>
        <span class="level-val down" id="slLevel">---</span>
      </div>
    </div>
  </div>

  <button class="btn-refresh" onclick="updateAllData()">Обновить данные</button>

  <script>
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const BACKEND_URL = "https://swkzx-46-160-189-108.free.pinggy.net";
    const SYMBOL = 'BTCUSDT';

    async function fetchTicker() {
      const res = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${SYMBOL}`);
      return await res.json();
    }

    async function fetchFunding() {
      const res = await fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${SYMBOL}`);
      return await res.json();
    }

    async function fetchOI() {
      const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${SYMBOL}`);
      return await res.json();
    }

    async function fetchMLPrediction() {
      const res = await fetch(`${BACKEND_URL}/api/predict`, {
        headers: {
          'bypass-tunnel-reminder': 'true'
        }
      });
      return await res.json();
    }

    async function updateAllData() {
      try {
        const [ticker, funding, oi, mlData] = await Promise.all([
          fetchTicker(),
          fetchFunding(),
          fetchOI(),
          fetchMLPrediction()
        ]);

        const price = parseFloat(ticker.lastPrice);
        const change = parseFloat(ticker.priceChangePercent);
        const fundingRate = parseFloat(funding.lastFundingRate) * 100;
        const openInterest = parseFloat(oi.openInterest);

        // Биржевые метрики
        document.getElementById('btcPrice').innerText = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 1 });
        const changeEl = document.getElementById('btcChange');
        changeEl.innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '% (24h)';
        changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');

        const fundEl = document.getElementById('btcFunding');
        fundEl.innerText = fundingRate.toFixed(4) + '%';
        fundEl.className = 'metric-value ' + (fundingRate > 0.03 ? 'down' : (fundingRate < -0.01 ? 'up' : 'neutral'));
        document.getElementById('btcOI').innerText = Math.round(openInterest).toLocaleString('en-US') + ' BTC';

        // Данные из CatBoost модели
        document.getElementById('btcRSI').innerText = mlData.rsi;
        document.getElementById('btcAtr').innerText = '$' + mlData.atr;

        const actionEl = document.getElementById('signalAction');
        const probEl = document.getElementById('signalProb');
        const tpEl = document.getElementById('tpLevel');
        const slEl = document.getElementById('slLevel');
        const container = document.getElementById('signalContainer');
        const reasonEl = document.getElementById('signalReason');

        actionEl.innerText = mlData.action;
        probEl.innerText = `${mlData.confidence}% ML Conf`;

        if (mlData.action.includes("LONG")) {
          actionEl.className = 'signal-direction up';
          container.style.borderLeftColor = 'var(--accent-green)';
          probEl.className = 'signal-conf up';
          tpEl.innerText = '$' + mlData.take_profit.toLocaleString();
          slEl.innerText = '$' + mlData.stop_loss.toLocaleString();
        } else if (mlData.action.includes("SHORT")) {
          actionEl.className = 'signal-direction down';
          container.style.borderLeftColor = 'var(--accent-red)';
          probEl.className = 'signal-conf down';
          tpEl.innerText = '$' + mlData.take_profit.toLocaleString();
          slEl.innerText = '$' + mlData.stop_loss.toLocaleString();
        } else {
          actionEl.className = 'signal-direction neutral';
          container.style.borderLeftColor = 'var(--accent-yellow)';
          probEl.className = 'signal-conf neutral';
          tpEl.innerText = '---';
          slEl.innerText = '---';
        }

        reasonEl.innerText = `CatBoost 15m • Горизонт: ${mlData.horizon} • Динамический ATR риск-профиль`;

      } catch (err) {
        console.error('Ошибка обновления данных:', err);
      }
    }

    updateAllData();
    setInterval(updateAllData, 15000);
  </script>
</body>
</html>
